onboarding = false

# $session は Claude Code の statusline から送るセッション名
# （dotfiles: claude/herdr-session-label.sh）。既定はディレクトリ名（workspace）が先頭。
[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "$session"],
  ["agent", "workspace", "tab"],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "$session"],
  ["workspace", "branch", "git_status"],
]
